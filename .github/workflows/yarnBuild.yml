# Builds and tests every push and pull request. Only a push to main also deploys.
#
# Pull requests never get AWS credentials: the deploy role in infra/initialSetup trusts main only, and the deploy job below
# runs on main only. A pull request can change this file, so it must not be able to reach anything that can deploy.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build_package:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000:8000
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: yarn install

    - name: Audit dependencies (fail on high/critical)
      run: |
        set -uo pipefail
        # yarn v1's `audit` exit code is a severity bitmask that ignores
        # `--level`, so any low/moderate advisory fails a `--level high` gate.
        # Parse the JSON summary instead and gate only on high/critical.
        audit_json=$(yarn audit --json 2>/dev/null || true)
        echo "$audit_json" | jq -r 'select(.type=="auditAdvisory") | .data.advisory | "\(.severity)\t\(.module_name)\t\(.title)"'
        high=$(echo "$audit_json" | jq -r 'select(.type=="auditSummary") | .data.vulnerabilities.high // 0')
        critical=$(echo "$audit_json" | jq -r 'select(.type=="auditSummary") | .data.vulnerabilities.critical // 0')
        echo "High: ${high:-0}, Critical: ${critical:-0}"
        if [ "${high:-0}" -gt 0 ] || [ "${critical:-0}" -gt 0 ]; then
          echo "::error::Found ${high} high and ${critical} critical severity vulnerabilities"
          exit 1
        fi

    - name: Typecheck
      run: yarn typecheck

    - name: Run tests
      env:
        DYNAMODB_ENDPOINT: http://localhost:8000
      run: yarn test

    - name: Build app with Auth0 config
      env:
        VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
        VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      run: yarn run build

    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1.0.8
      with:
        tofu_version: 1.11.2

    # No credentials and no backend: this only checks that the configuration is well formed.
    - name: Check the infrastructure files
      run: |
        tofu fmt -check -recursive infra
        for dir in infra infra/initialSetup; do
          tofu -chdir="$dir" init -backend=false -input=false
          tofu -chdir="$dir" validate
        done

  offline_spike:
    name: Offline spike (browser tests)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 24.x
        cache: 'yarn'
    - run: yarn install

    # Chromium only: the spike proves that the persisted cache and queued writes survive a reload, a cold launch with no signal and
    # a weak connection. It runs against a stub API and needs no secrets.
    - run: yarn playwright install --with-deps chromium
    - run: yarn test:e2e

  deploy:
    name: Deploy
    needs: [build_package, offline_spike]
    # Only a push to main. Never a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Two pushes close together must not apply at once. A deploy that has started is never cancelled halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
      TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
      TF_VAR_auth0_audience: ${{ secrets.AUTH0_AUDIENCE }}
      TF_VAR_state_bucket: kingchappers-terraform-state-bucket
      TF_VAR_app_name: hearthwise
      TF_VAR_environment: production
      # Where sign-up and security alerts are emailed, from the repository variable ALERT_EMAIL. Empty: the topic has no subscriber.
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      # The public half of the push key pair (step 6). Empty until the secret is created, and push stays off.
      TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
      # The app's custom hostname, from the repository variable APP_DOMAIN. Empty until set: the app is then reached at the API Gateway URL.
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 24.x
        cache: 'yarn'
    - run: yarn install --frozen-lockfile

    - name: Build the Lambda bundles
      env:
        VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
        VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        VITE_AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      run: yarn run build

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
      with:
        role-to-assume: arn:aws:iam::192350001975:role/hearthwise-github-actions
        aws-region: eu-west-2

    - name: Install OpenTofu
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1.0.8
      with:
        tofu_version: 1.11.2

    # The plan is applied straight away and never uploaded: this repository is public, and a saved plan can hold the
    # Auth0 values.
    # Between plan and apply, the plan is checked for deletions that cannot be quietly undone (the data table, the custom domain,
    # its certificate and mapping). plan.json holds variable values: it stays on the runner and only addresses are printed.
    - name: OpenTofu init, plan, check and apply
      working-directory: infra
      env:
        TF_INPUT: 'false'
        TF_IN_AUTOMATION: 'true'
        # Set to "true" for one deliberate deploy that must delete or replace those resources (for example moving to a new domain).
        ALLOW_DESTRUCTIVE_DEPLOY: ${{ vars.ALLOW_DESTRUCTIVE_DEPLOY }}
      timeout-minutes: 15
      run: |
        tofu init -backend-config=backend.hcl
        tofu plan -out=tfplan
        tofu show -json tfplan > plan.json
        node ../scripts/check-plan.mjs plan.json
        tofu apply -auto-approve tfplan
